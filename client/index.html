  <meta name="theme-color" content="#ECF3F0" />
  <script>try{var v=localStorage.getItem("gym_theme");var d=v==="dark"||(v!=="light"&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.setAttribute("data-theme",d?"dark":"light");document.querySelector('meta[name="theme-color"]').setAttribute("content",d?"#0A1311":"#ECF3F0")}catch(e){}</script>
</head>
